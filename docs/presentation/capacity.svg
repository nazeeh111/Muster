<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="760" viewBox="0 0 1160 760" role="img" aria-labelledby="capacity-title capacity-desc"><title id="capacity-title">Two driver positions, one available assignment</title><desc id="capacity-desc">The two driver positions are both eligible for Ada, but her total assignment cap is one; making Cy available on Saturday changes actual coverage from four of five to five of five while Bob’s locked assignment stays fixed.</desc><style>:root{--paper:#f3f7f6;--ink:#243c48;--muted:#536770;--rule:#c8d5d5;--green:#2b665d;--soft:#e8f1ee;--white:#ffffff;--red:#a2262c;--body:Arial,sans-serif;--display:Georgia,serif;}text{font-family:var(--body)}text.display{font-family:var(--display)}</style><rect width="1160" height="760" fill="var(--paper)"/><text x="48" y="48" font-size="18" fill="var(--green)" font-weight="600">Muster</text><text x="48" y="108" font-size="48" fill="var(--ink)" font-weight="400" class="display">Two driver positions.</text><text x="48" y="170" font-size="48" fill="var(--ink)" font-weight="400" class="display">One available assignment.</text><text x="48" y="215" font-size="18" fill="var(--muted)" font-weight="400">Actual synthetic rota. Eligibility is not enough; total capacity also matters.</text><g transform="translate(24,68)"><path data-edge="collection:ada" d="M188 228H208Q216 228 216 236V244Q216 252 224 252H244" fill="none" stroke="var(--muted)" stroke-width="2"/><path data-edge="delivery:ada" d="M188 324H200Q208 324 208 316V284Q208 276 216 276H244" fill="none" stroke="var(--muted)" stroke-width="2"/><rect x="24" y="196" width="164" height="64" rx="0" fill="var(--white)" stroke="var(--rule)"/><rect x="24" y="292" width="164" height="64" rx="0" fill="var(--white)" stroke="var(--rule)"/><rect x="244" y="236" width="152" height="64" rx="0" fill="var(--soft)" stroke="var(--green)"/><text x="36" y="220" font-size="14" fill="var(--muted)" font-weight="400">Friday</text><text x="36" y="244" font-size="17" fill="var(--ink)" font-weight="600">Collect produce</text><text x="36" y="316" font-size="14" fill="var(--muted)" font-weight="400">Saturday</text><text x="36" y="340" font-size="17" fill="var(--ink)" font-weight="600">Deliver parcels</text><text x="260" y="261" font-size="19" fill="var(--ink)" font-weight="600">Ada</text><text x="260" y="285" font-size="16" fill="var(--ink)" font-weight="400">Total cap: 1</text></g><text x="48" y="472" font-size="22" fill="var(--red)" font-weight="600">Two eligible positions, capacity one.</text><text x="48" y="505" font-size="19" fill="var(--muted)" font-weight="400">At least one must stay unfilled.</text><text x="600" y="278" font-size="30" fill="var(--ink)" font-weight="400" class="display">One stated change</text><text x="600" y="313" font-size="21" fill="var(--green)" font-weight="600">Cy is available on Saturday.</text><text x="600" y="360" font-size="14" fill="var(--muted)" font-weight="400">Position</text><text x="850" y="360" font-size="14" fill="var(--muted)" font-weight="400">Before</text><text x="1008" y="360" font-size="14" fill="var(--muted)" font-weight="400">After</text><path d="M600 406H1112" stroke="var(--rule)"/><text x="600" y="393" font-size="16" fill="var(--ink)" font-weight="400">Collect produce</text><text x="850" y="393" font-size="16" fill="var(--ink)" font-weight="400">Ada</text><text x="1008" y="393" font-size="16" fill="var(--ink)" font-weight="400">Ada</text><path d="M600 453H1112" stroke="var(--rule)"/><text x="600" y="440" font-size="16" fill="var(--ink)" font-weight="400">Deliver parcels</text><text x="850" y="440" font-size="16" fill="var(--red)" font-weight="600">Unfilled</text><text x="1008" y="440" font-size="16" fill="var(--ink)" font-weight="600">Cy</text><path d="M600 500H1112" stroke="var(--rule)"/><text x="600" y="487" font-size="16" fill="var(--ink)" font-weight="400">Welcome desk</text><text x="850" y="487" font-size="16" fill="var(--ink)" font-weight="400">Bob</text><text x="1008" y="487" font-size="16" fill="var(--ink)" font-weight="400">Bob</text><path d="M600 547H1112" stroke="var(--rule)"/><text x="600" y="534" font-size="16" fill="var(--ink)" font-weight="400">Pack parcels</text><text x="850" y="534" font-size="16" fill="var(--ink)" font-weight="400">Dee</text><text x="1008" y="534" font-size="16" fill="var(--ink)" font-weight="400">Dee</text><path d="M600 594H1112" stroke="var(--rule)"/><text x="600" y="581" font-size="16" fill="var(--ink)" font-weight="400">Restock pantry</text><text x="850" y="581" font-size="16" fill="var(--ink)" font-weight="400">Eve</text><text x="1008" y="581" font-size="16" fill="var(--ink)" font-weight="400">Eve</text><text x="600" y="649" font-size="18" fill="var(--green)" font-weight="600">Bob’s welcome-desk lock stays fixed.</text><text x="48" y="600" font-size="34" fill="var(--red)" font-weight="600">4/5 filled</text><text x="248" y="600" font-size="34" fill="var(--green)" font-weight="600">5/5 filled</text><text x="48" y="638" font-size="18" fill="var(--muted)" font-weight="400">Before: 1 reference change. After: 0.</text><path d="M48 692H1112" stroke="var(--rule)"/><text x="48" y="728" font-size="17" fill="var(--muted)" font-weight="400">Source-derived eligibility and all five assignments. Declared model, not real-world consent.</text></svg>
